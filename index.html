<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TR Sewage Monitoring</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .card {
            text-align: center;
            background: #1e293b;
            padding: 50px;
            border-radius: 20px;
            width: 80%;
            max-width: 700px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .status {
            font-size: 22px;
            margin-top: 30px;
        }

        .online {
            color: #4ade80;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>TR Sewage Monitoring System</h1>

    <p>Remote Water Level Monitoring</p>

    <div class="status">
        Web Dashboard:
        <span class="online">ONLINE</span>
    </div>

</div>

</body>
</html>
